<header><div><div class="brand-row"><h1>Photo Note</h1><span class="total-chars" id="totalChars">メモ合計 0文字</span></div><div class="sub">写真と一緒に、日々を残す。</div></div><div style="display:flex;align-items:center;gap:8px"><button class="cancel" id="backupExport" type="button">バックアップ</button><div class="count" id="count">0 notes</div></div></header><main>
<section class="composer"><div class="pickrow"><button class="pick" id="openCamera" type="button">カメラで撮る</button><label class="pick" for="galleryPhotos">写真をまとめて選ぶ</label></div><input id="galleryPhotos" type="file" accept="image/*" multiple>
<div class="photo-grid" id="draftGrid"></div><div class="photo-count" id="photoCount">写真は最大100枚まで追加できます</div><textarea id="memo" maxlength="5000" placeholder="このノートについてメモを書く…"></textarea><div class="editor-tools"><span class="char-count" id="charCount">0 / 5,000文字</span><button class="cancel" id="cancel" type="button" style="display:none">編集をやめる</button></div><button class="save" id="save" disabled>ノートに保存する</button><div class="hint">写真とメモはこの端末のブラウザ内に保存されます。別の端末とは自動同期されません。写真100枚は容量が大きくなるため、端末の空き容量に注意してください。</div></section>
<div class="section"><h2>あなたのノート</h2><span>新しい順</span></div><section class="notes" id="notes"><div class="empty">まだノートはありません。<br>最初の写真を残してみましょう。</div></section></main>
<div class="camera-modal" id="cameraModal" role="dialog" aria-modal="true" aria-label="Photo Noteカメラ"><div class="camera-top"><button id="cameraClose" type="button">閉じる</button><span id="cameraMode">背面カメラ</span><button id="cameraSwitch" type="button">カメラ切替</button></div><div class="camera-stage"><video id="cameraVideo" autoplay muted playsinline></video></div><div class="camera-zoom"><span>−</span><input id="cameraZoom" type="range" min="1" max="3" step="0.1" value="1" aria-label="カメラズーム"><span>＋</span><span class="camera-zoom-value" id="cameraZoomValue">1.0×</span></div><div class="camera-status" id="cameraStatus">カメラを準備しています</div><div class="camera-bottom"><button id="cameraFlash" type="button" disabled>フラッシュは端末依存</button><button class="shutter" id="cameraCapture" type="button" aria-label="撮影"></button><button id="cameraDone" type="button">完了</button></div></div><div class="photo-viewer" id="photoViewer" role="dialog" aria-modal="true" aria-label="写真の拡大表示"><button class="nav-back" id="viewerBack" type="button" aria-label="一覧画面に戻る">← <span>一覧へ</span></button><button class="viewer-prev" id="viewerPrev" type="button">‹</button><img id="viewerImage" alt="拡大した写真"><div class="zoom-tools"><button id="zoomOut" type="button" aria-label="縮小">−</button><button id="zoomReset" type="button" aria-label="倍率を戻す">↺</button><button id="zoomIn" type="button" aria-label="拡大">＋</button></div><button class="viewer-next" id="viewerNext" type="button">›</button><div class="viewer-index" id="viewerIndex"></div></div><div class="story-modal" id="storyModal" role="dialog" aria-modal="true" aria-label="ストーリーモード"><div class="story-backdrop" id="storyBackdrop"></div><div class="story-blur" id="storyBlur"></div><div class="story-top"><button id="storyClose" type="button" aria-label="一覧画面に戻る">← <span>一覧へ</span></button><span class="story-count" id="storyCount"></span><button id="storyTop" type="button">写真に戻る ↑</button></div><div class="story-scroll" id="storyScroll"><section class="story-hero"><div class="story-hero-inner"><div class="story-kicker">A MOMENT TO REMEMBER</div><h2 class="story-title" id="storyTitle">その日の記録</h2><div class="story-hint">スクロールして、記憶をたどる</div></div></section><section class="story-sheet"><div class="story-date" id="storyDate"></div><div class="story-memo" id="storyMemo"></div><div class="story-photos" id="storyPhotos"></div><div class="story-end">— PHOTO NOTE —</div></section></div></div><div class="toast" id="toast"></div>
<script>
const DB='photo-note-db',STORE='notes';let db,draft=[],editingId=null,viewerImages=[],viewerAt=0,cameraStream=null,cameraFacing='environment',cameraZoom=1,nativeZoom=false,cameraZoomMin=1,cameraZoomMax=3;const $=id=>document.getElementById(id);
async function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}$('cameraVideo').srcObject=null}
async function configureCameraZoom(){cameraZoom=1;nativeZoom=false;cameraZoomMin=1;cameraZoomMax=3;const track=cameraStream?.getVideoTracks?.()[0];try{const caps=track?.getCapabilities?.();if(caps?.zoom){nativeZoom=true;cameraZoomMin=caps.zoom.min||1;cameraZoomMax=Math.min(caps.zoom.max||3,8)}}catch(e){}const slider=$('cameraZoom');slider.min=String(cameraZoomMin);slider.max=String(cameraZoomMax);slider.step=nativeZoom?String(track.getCapabilities().zoom.step||0.1):'0.1';slider.value='1';$('cameraZoomValue').textContent='1.0×';$('cameraVideo').style.transform='scale(1)';}
async function setCameraZoom(value){cameraZoom=Math.max(cameraZoomMin,Math.min(cameraZoomMax,Number(value)||1));$('cameraZoom').value=String(cameraZoom);$('cameraZoomValue').textContent=cameraZoom.toFixed(1)+'×';const video=$('cameraVideo');if(nativeZoom){const track=cameraStream?.getVideoTracks?.()[0];try{await track.applyConstraints({advanced:[{zoom:cameraZoom}]});video.style.transform='scale(1)';return}catch(e){nativeZoom=false}}video.style.transform=`scale(${cameraZoom})`;}
async function startCamera(){await stopCamera();if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('cameraStatus').textContent='このブラウザではカメラを利用できません。HTTPSのSafariで開いてください。';return}try{cameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:cameraFacing},width:{ideal:1920},height:{ideal:1080}}});$('cameraVideo').srcObject=cameraStream;await $('cameraVideo').play();await configureCameraZoom();$('cameraMode').textContent=cameraFacing==='environment'?'背面カメラ':'前面カメラ';$('cameraStatus').textContent=nativeZoom?'カメラのズームを調整できます':'ズームを調整できます';}catch(err){$('cameraStatus').textContent=err.name==='NotAllowedError'?'カメラの使用が許可されていません。Safariの設定を確認してください。':'カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。'}}
$('cameraZoom').addEventListener('input',e=>{setCameraZoom(e.target.value)});
$('openCamera').onclick=async()=>{if(draft.length>=100)return toast('写真は100枚までです');$('cameraModal').classList.add('open');document.body.style.overflow='hidden';await startCamera()};
$('cameraClose').onclick=async()=>{await stopCamera();$('cameraModal').classList.remove('open');document.body.style.overflow=''};
$('cameraDone').onclick=$('cameraClose').onclick;
$('cameraSwitch').onclick=async()=>{cameraFacing=cameraFacing==='environment'?'user':'environment';await startCamera()};
$('cameraCapture').onclick=async()=>{const v=$('cameraVideo');if(!cameraStream||!v.videoWidth)return toast('カメラの準備ができていません');if(draft.length>=100)return toast('写真は100枚までです');const c=document.createElement('canvas');const ctx=c.getContext('2d');if(nativeZoom||cameraZoom<=1.001){c.width=v.videoWidth;c.height=v.videoHeight;ctx.drawImage(v,0,0,c.width,c.height)}else{const sw=v.videoWidth/cameraZoom,sh=v.videoHeight/cameraZoom,sx=(v.videoWidth-sw)/2,sy=(v.videoHeight-sh)/2;c.width=Math.round(sw);c.height=Math.round(sh);ctx.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height)}draft.push(c.toDataURL('image/jpeg',.92));renderDraft();updateCount();$('cameraStatus').textContent=`撮影しました（${draft.length} / 100枚）。続けて撮影できます。`};
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function tx(mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,mode),s=t.objectStore(STORE);let req=fn(s);t.oncomplete=()=>resolve(req?.result);t.onerror=()=>reject(t.error)})}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function updateCount(){$('charCount').textContent=Array.from($('memo').value).length.toLocaleString('ja-JP')+' / 5,000文字';$('photoCount').textContent=`${draft.length} / 100枚`;$('save').disabled=draft.length===0}
function oldImages(n){return Array.isArray(n.images)?n.images:(n.image?[n.image]:[])}
async function exportBackup(){
  try{
    const all=await tx('readonly',s=>s.getAll());
    const payload={format:'PhotoNoteBackup',version:1,exportedAt:new Date().toISOString(),notes:all};
    const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='photo-note-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('バックアップを書き出しました。ファイルアプリに保存してね');
  }catch(e){toast('バックアップを作成できませんでした')}
}
$('backupExport').onclick=exportBackup;

function reset(){editingId=null;draft=[];$('galleryPhotos').value='';$('memo').value='';$('save').textContent='ノートに保存する';$('cancel').style.display='none';renderDraft();updateCount()}
$('memo').addEventListener('input',updateCount);$('cancel').onclick=reset;
function openViewer(images,index=0){viewerImages=images;viewerAt=index;showViewer();$('photoViewer').classList.add('open');document.body.style.overflow='hidden'}let zoom=1,panX=0,panY=0;function applyZoom(){$('viewerImage').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`}function resetZoom(){zoom=1;panX=0;panY=0;applyZoom()}function showViewer(){resetZoom();$('viewerImage').src=viewerImages[viewerAt];$('viewerIndex').textContent=`${viewerAt+1} / ${viewerImages.length}`;$('viewerPrev').style.display=viewerImages.length>1?'block':'none';$('viewerNext').style.display=viewerImages.length>1?'block':'none'}function closeViewer(){resetZoom();$('photoViewer').classList.remove('open');$('viewerImage').removeAttribute('src');document.body.style.overflow=''}$('viewerBack').onclick=closeViewer;$('photoViewer').addEventListener('click',e=>{if(e.target===$('photoViewer'))closeViewer()});$('viewerPrev').onclick=()=>{viewerAt=(viewerAt-1+viewerImages.length)%viewerImages.length;showViewer()};$('viewerNext').onclick=()=>{viewerAt=(viewerAt+1)%viewerImages.length;showViewer()};$('zoomIn').onclick=()=>{zoom=Math.min(5,zoom+.5);clampViewerPan();applyZoom()};$('zoomOut').onclick=()=>{zoom=Math.max(1,zoom-.5);if(zoom===1){panX=0;panY=0}else clampViewerPan();applyZoom()};$('zoomReset').onclick=resetZoom;let pinchStart=0,pinchZoom=1,lastTouch=null;const viewerImg=$('viewerImage');
function clampViewerPan(){
  const box=$('photoViewer').getBoundingClientRect();
  const baseW=viewerImg.clientWidth,baseH=viewerImg.clientHeight;
  const maxX=Math.max(0,(baseW*zoom-box.width)/2);
  const maxY=Math.max(0,(baseH*zoom-box.height)/2);
  panX=Math.max(-maxX,Math.min(maxX,panX));
  panY=Math.max(-maxY,Math.min(maxY,panY));
}
viewerImg.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    pinchZoom=zoom;lastTouch=null;

    lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};
  }

  if(e.touches.length===2&&pinchStart){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    zoom=Math.max(1,Math.min(5,pinchZoom*d/pinchStart));
    if(zoom===1){panX=0;panY=0}
    clampViewerPan();applyZoom();
  }else if(e.touches.length===1&&lastTouch&&zoom>1){
    e.preventDefault();
    panX+=e.touches[0].clientX-lastTouch.x;panY+=e.touches[0].clientY-lastTouch.y;
    lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};
    clampViewerPan();applyZoom();
  }
},{passive:false});
viewerImg.addEventListener('touchend',()=>{pinchStart=0;lastTouch=null});
viewerImg.addEventListener('dblclick',()=>{
  zoom=zoom===1?2:1;
  if(zoom===1){panX=0;panY=0}else clampViewerPan();
  applyZoom();
});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft'&&viewerImages.length){viewerAt=(viewerAt-1+viewerImages.length)%viewerImages.length;showViewer()}if(e.key==='ArrowRight'&&viewerImages.length){viewerAt=(viewerAt+1)%viewerImages.length;showViewer()}});
function fileData(f){return new Promise((res,rej)=>{if(!f.type.startsWith('image/'))return rej();const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function addFiles(files){const room=100-draft.length;if(room<=0)return toast('写真は100枚までです');const chosen=[...files].slice(0,room);if(files.length>room)toast('追加できるのは残り'+room+'枚です');for(const f of chosen){try{draft.push(await fileData(f))}catch{toast('画像を読み込めませんでした')}}renderDraft();updateCount()}
$('galleryPhotos').addEventListener('change',async e=>{await addFiles(e.target.files);e.target.value=''});
function renderDraft(){const root=$('draftGrid');root.innerHTML='';draft.forEach((src,i)=>{const cell=document.createElement('div');cell.className='photo-cell';const img=document.createElement('img');img.src=src;img.alt='追加した写真';img.onclick=()=>openViewer(draft,i);const rm=document.createElement('button');rm.className='remove-photo';rm.type='button';rm.textContent='×';rm.setAttribute('aria-label','写真を削除');rm.onclick=()=>{draft.splice(i,1);renderDraft();updateCount()};const move=document.createElement('button');move.className='move-photo';move.type='button';move.textContent=i===0?'先頭':`#${i+1} ↕`;move.title='写真を前へ移動';move.onclick=()=>{if(i>0){[draft[i-1],draft[i]]=[draft[i],draft[i-1]];renderDraft()}};cell.append(img,rm,move);root.append(cell)})}
$('save').onclick=async()=>{if(!draft.length)return toast('写真を追加してください');$('save').disabled=true;try{if(editingId){const n=await tx('readonly',s=>s.get(editingId));if(!n)throw Error();n.images=draft;n.image=draft[0];n.memo=$('memo').value;n.updatedAt=new Date().toISOString();await tx('readwrite',s=>s.put(n));toast('ノートを更新しました')}else{const n={id:Date.now(),images:draft,image:draft[0],memo:$('memo').value,date:new Date().toISOString()};await tx('readwrite',s=>s.add(n));toast('ノートに保存しました')}reset();await render()}catch(e){toast('保存できませんでした。端末の空き容量を確認してください');$('save').disabled=false}};
function beginEdit(n){editingId=n.id;draft=oldImages(n).slice();$('memo').value=n.memo||'';$('save').textContent='変更を保存する';$('cancel').style.display='inline-block';renderDraft();updateCount();document.querySelector('.composer').scrollIntoView({behavior:'smooth',block:'start'})}
async function render(){const all=await tx('readonly',s=>s.getAll());all.sort((a,b)=>b.id-a.id);$('count').textContent=all.length+' notes';const totalChars=all.reduce((sum,n)=>sum+Array.from(n.memo||'').length,0);$('totalChars').textContent='メモ合計 '+totalChars.toLocaleString('ja-JP')+'文字';const root=$('notes');root.innerHTML='';if(!all.length){root.innerHTML='<div class="empty">まだノートはありません。<br>最初の写真を残してみましょう。</div>';return}for(const n of all){const imgs=oldImages(n);const article=document.createElement('article');article.className='note';const cover=document.createElement('img');cover.className='cover';cover.src=imgs[0];cover.alt='ノートの写真';cover.onclick=()=>openViewer(imgs,0);const body=document.createElement('div');body.className='note-body';const date=document.createElement('div');date.className='date';date.textContent=new Date(n.updatedAt||n.date).toLocaleString('ja-JP',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+` ・ ${imgs.length}枚 ・ `;const chars=document.createElement('span');chars.className='note-char-count';chars.textContent=Array.from(n.memo||'').length.toLocaleString('ja-JP')+'文字';const text=document.createElement('div');text.className='note-text';text.textContent=n.memo||'メモはありません';const actions=document.createElement('div');actions.className='note-actions';const edit=document.createElement('button');edit.className='edit';edit.textContent='編集する';edit.onclick=()=>beginEdit(n);const del=document.createElement('button');del.className='delete';del.textContent='このノートを削除';del.onclick=async()=>{if(confirm('このノートを削除しますか？')){await tx('readwrite',s=>s.delete(n.id));if(editingId===n.id)reset();render()}};const story=document.createElement('button');story.className='edit';story.textContent='ストーリーで見る';story.onclick=()=>openStory(n);actions.append(story,edit,del);date.append(chars);body.append(date,text);if(imgs.length>1){const strip=document.createElement('div');strip.className='thumb-strip';imgs.slice(1,7).forEach((src,i)=>{const im=document.createElement('img');im.src=src;im.alt='写真 '+(i+2);im.onclick=()=>openViewer(imgs,i+1);strip.append(im)});if(imgs.length>7){const more=document.createElement('span');more.style.cssText='font-size:11px;color:var(--muted);align-self:center';more.textContent=`+${imgs.length-7}`;strip.append(more)}body.append(strip)}body.append(actions);article.append(cover,body);root.append(article)}}

let activeStoryImages=[],activeStoryAt=0;
function setStoryPhoto(i){activeStoryAt=(i+activeStoryImages.length)%activeStoryImages.length;const src=activeStoryImages[activeStoryAt];$('storyBackdrop').style.backgroundImage=`url("${src}")`;$('storyCount').textContent=`${activeStoryAt+1} / ${activeStoryImages.length}枚`;$('storyPhotos').querySelectorAll('img').forEach((im,j)=>im.classList.toggle('active',j===activeStoryAt));}
function updateStoryDepth(){const progress=Math.min(1,$('storyScroll').scrollTop/360);const blur=progress*7;$('storyBlur').style.backdropFilter=`blur(${blur}px)`;$('storyBlur').style.webkitBackdropFilter=`blur(${blur}px)`;$('storyBackdrop').style.filter=`brightness(${.82-progress*.25}) saturate(${1-progress*.18})`;}
function openStory(n){activeStoryImages=oldImages(n);if(!activeStoryImages.length)return;const date=new Date(n.updatedAt||n.date);$('storyTitle').textContent=(n.memo||'').trim().split(/\n/)[0].slice(0,42)||'その日の記録';$('storyDate').textContent=date.toLocaleString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long',hour:'2-digit',minute:'2-digit'});$('storyMemo').textContent=n.memo||'この日のメモはまだありません。';$('storyMemo').classList.toggle('story-empty',!n.memo);const strip=$('storyPhotos');strip.innerHTML='';if(activeStoryImages.length>1){activeStoryImages.forEach((src,i)=>{const im=document.createElement('img');im.src=src;im.alt=`写真 ${i+1}`;im.onclick=()=>setStoryPhoto(i);strip.append(im)})}strip.style.display=activeStoryImages.length>1?'flex':'none';setStoryPhoto(0);$('storyScroll').scrollTop=0;updateStoryDepth();$('storyModal').classList.add('open');document.body.style.overflow='hidden';}
function closeStory(){$('storyModal').classList.remove('open');document.body.style.overflow='';$('storyBackdrop').style.backgroundImage='';}
$('storyClose').onclick=closeStory;$('storyTop').onclick=()=>$('storyScroll').scrollTo({top:0,behavior:'smooth'});$('storyScroll').addEventListener('scroll',updateStoryDepth,{passive:true});$('storyModal').addEventListener('click',e=>{if(e.target===$('storyModal'))closeStory()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('storyModal').classList.contains('open'))closeStory()});

document.addEventListener('visibilitychange',()=>{if(document.hidden&&cameraStream)stopCamera()});
openDB().then(async d=>{db=d;updateCount();await render()}).catch(()=>toast('このブラウザでは保存機能を利用できません'));
</script></body></html>
