<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ed"><title>Photo Note</title>
<style>
:root{--bg:#f6f3ed;--paper:#fffefa;--ink:#292821;--muted:#827f75;--line:#e9e4d9;--accent:#496b59}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{max-width:760px;margin:auto;padding:28px 20px 12px;display:flex;align-items:center;justify-content:space-between}h1{font-family:Georgia,serif;font-size:29px;font-weight:500;margin:0;letter-spacing:-.7px}.sub{font-size:12px;color:var(--muted);margin-top:5px}.count{font-size:12px;color:var(--muted)}main{max-width:760px;margin:auto;padding:12px 16px 100px}
.composer{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 18px #3c342008}.pick{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:52px;border:1.5px dashed #b9c5bb;border-radius:12px;color:var(--accent);font-weight:650;background:#f7f8f4;cursor:pointer;font-size:15px}input[type=file]{display:none}#preview{display:none;width:100%;max-height:280px;object-fit:contain;background:#f0eee8;border-radius:12px;margin-top:12px}textarea{width:100%;resize:vertical;min-height:76px;border:0;outline:0;background:transparent;font:15px/1.7 inherit;padding:13px 2px 4px;color:var(--ink)}textarea::placeholder{color:#aaa69b}.save{width:100%;border:0;border-radius:12px;background:var(--accent);color:white;font-size:15px;font-weight:650;padding:14px;cursor:pointer}.save:disabled{opacity:.4;cursor:not-allowed}.section{display:flex;justify-content:space-between;align-items:baseline;margin:28px 4px 13px}.section h2{font-size:17px;font-weight:650;margin:0}.section span{font-size:12px;color:var(--muted)}.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.note{background:var(--paper);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #3c342007}.note img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eee}.note-body{padding:11px 12px 12px}.date{font-size:11px;color:var(--muted);margin-bottom:6px}.note-text{font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.delete{border:0;background:none;color:#a19c90;font-size:12px;padding:9px 0 0;cursor:pointer}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:36px 12px;font-size:13px;line-height:1.8}.hint{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 2px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#292821;color:#fff;padding:11px 16px;border-radius:30px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(min-width:620px){.notes{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head>
<body>
<header><div><h1>Photo Note</h1><div class="sub">写真と一緒に、日々を残す。</div></div><div class="count" id="count">0 notes</div></header>
<main>
<section class="composer">
<label class="pick" for="photo">＋ 写真を撮る・選ぶ</label><input id="photo" type="file" accept="image/*" capture="environment">
<img id="preview" alt="選択した写真のプレビュー">
<textarea id="memo" placeholder="この写真についてメモを書く…"></textarea>
<button class="save" id="save" disabled>ノートに保存する</button>
<div class="hint">写真とメモは、このブラウザの中に保存されます。別の端末とは自動で同期されません。</div>
</section>
<div class="section"><h2>あなたのノート</h2><span>新しい順</span></div>
<section class="notes" id="notes"><div class="empty">まだノートはありません。<br>最初の写真を残してみましょう。</div></section>
</main><div class="toast" id="toast"></div>
<script>
const DB='photo-note-db', STORE='notes';let db,selected='';
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function tx(mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,mode),s=t.objectStore(STORE);let req=fn(s);t.oncomplete=()=>resolve(req?.result);t.onerror=()=>reject(t.error)})}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}
$('photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('画像ファイルを選んでください');const reader=new FileReader();reader.onload=()=>{selected=reader.result;$('preview').src=selected;$('preview').style.display='block';$('save').disabled=false};reader.readAsDataURL(f)});
$('save').addEventListener('click',async()=>{if(!selected)return;const item={id:Date.now(),image:selected,memo:$('memo').value.trim(),date:new Date().toISOString()};$('save').disabled=true;try{await tx('readwrite',s=>s.add(item));selected='';$('photo').value='';$('preview').removeAttribute('src');$('preview').style.display='none';$('memo').value='';await render();toast('ノートに保存しました')}catch(e){toast('保存できませんでした。写真のサイズを小さくして試してください')}finally{$('save').disabled=!selected}});
async function render(){const all=await tx('readonly',s=>s.getAll());all.sort((a,b)=>b.id-a.id);$('count').textContent=all.length+' notes';const root=$('notes');root.innerHTML='';if(!all.length){root.innerHTML='<div class="empty">まだノートはありません。<br>最初の写真を残してみましょう。</div>';return}for(const n of all){const article=document.createElement('article');article.className='note';const img=document.createElement('img');img.src=n.image;img.alt='保存した写真';const body=document.createElement('div');body.className='note-body';const date=document.createElement('div');date.className='date';date.textContent=new Date(n.date).toLocaleString('ja-JP',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});const text=document.createElement('div');text.className='note-text';text.textContent=n.memo||'メモはありません';const del=document.createElement('button');del.className='delete';del.textContent='このノートを削除';del.onclick=async()=>{if(confirm('このノートを削除しますか？')){await tx('readwrite',s=>s.delete(n.id));render()}};body.append(date,text,del);article.append(img,body);root.append(article)}}
openDB().then(async d=>{db=d;await render()}).catch(()=>toast('このブラウザでは保存機能を利用できません'));
</script></body></html>
