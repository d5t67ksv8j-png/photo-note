<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3ed"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>Photo Note</title>
<style>
:root{--bg:#f6f3ed;--paper:#fffefa;--ink:#292821;--muted:#827f75;--line:#e9e4d9;--accent:#496b59}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}header{max-width:760px;margin:auto;padding:28px 20px 12px;display:flex;align-items:center;justify-content:space-between}h1{font-family:Georgia,serif;font-size:29px;font-weight:500;margin:0;letter-spacing:-.7px}.sub{font-size:12px;color:var(--muted);margin-top:5px}.count{font-size:12px;color:var(--muted)}main{max-width:760px;margin:auto;padding:12px 16px 100px}.composer{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 18px #3c342008}.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pick{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:49px;border:1.5px dashed #b9c5bb;border-radius:12px;color:var(--accent);font-weight:650;background:#f7f8f4;cursor:pointer;font-size:14px}input[type=file]{display:none}.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.photo-cell{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#f0eee8}.photo-cell img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}.remove-photo{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:26px;height:26px;background:#222b;color:white;font-size:18px;line-height:1}.photo-count{font-size:12px;color:var(--muted);margin:9px 2px 0}textarea{width:100%;resize:vertical;min-height:90px;border:0;outline:0;background:transparent;font:15px/1.7 -apple-system,BlinkMacSystemFont,sans-serif;padding:13px 2px 4px;color:var(--ink)}textarea::placeholder{color:#aaa69b}.save{width:100%;border:0;border-radius:12px;background:var(--accent);color:white;font-size:15px;font-weight:650;padding:14px;cursor:pointer}.save:disabled{opacity:.4;cursor:not-allowed}.editor-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 10px}.char-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.cancel{border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);padding:10px 14px;cursor:pointer}.note-actions{display:flex;gap:14px;flex-wrap:wrap}.edit,.delete{border:0;background:none;color:var(--accent);font-size:12px;padding:9px 0 0;cursor:pointer}.delete{color:#a19c90}.section{display:flex;justify-content:space-between;align-items:baseline;margin:28px 4px 13px}.section h2{font-size:17px;font-weight:650;margin:0}.section span{font-size:12px;color:var(--muted)}.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.note{background:var(--paper);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #3c342007}.cover{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eee;cursor:zoom-in}.thumb-strip{display:flex;gap:5px;padding:7px 9px 0;overflow:hidden}.thumb-strip img{width:42px;height:42px;object-fit:cover;border-radius:6px;flex:0 0 auto;cursor:zoom-in}.note-body{padding:11px 12px 12px}.date{font-size:11px;color:var(--muted);margin-bottom:6px}.note-text{font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:36px 12px;font-size:13px;line-height:1.8}.hint,.photo-tip{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 2px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#292821;color:#fff;padding:11px 16px;border-radius:30px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}.photo-viewer{position:fixed;inset:0;z-index:40;background:rgba(18,18,16,.97);display:none;align-items:center;justify-content:center;padding:18px}.photo-viewer.open{display:flex}.photo-viewer img{max-width:100%;max-height:100%;object-fit:contain;touch-action:none;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none}.zoom-tools{position:absolute;top:max(70px,calc(env(safe-area-inset-top) + 62px));right:18px;display:flex;gap:7px}.zoom-tools button{width:38px;height:38px;border:1px solid #ffffff66;border-radius:50%;background:#222;color:#fff;font-size:20px}.viewer-close,.viewer-prev,.viewer-next{position:absolute;border:1px solid #ffffff55;border-radius:50%;background:#222;color:white;cursor:pointer}.viewer-close{top:max(18px,env(safe-area-inset-top));right:18px;width:42px;height:42px;font-size:25px}.viewer-prev,.viewer-next{top:50%;width:42px;height:42px;font-size:24px;transform:translateY(-50%)}.viewer-prev{left:12px}.viewer-next{right:12px}.viewer-index{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));color:#fff;font-size:12px}.camera-note{font-size:11px;color:var(--muted);line-height:1.6;margin:9px 2px 0}.camera-modal{position:fixed;inset:0;z-index:60;background:#111;display:none;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}.camera-modal.open{display:flex}.camera-top{height:54px;display:flex;align-items:center;justify-content:space-between;color:white}.camera-top button,.camera-bottom button{border:1px solid #ffffff55;background:#292929;color:white;border-radius:24px;padding:10px 15px;font-size:14px}.camera-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}.camera-stage video{width:100%;max-height:100%;object-fit:contain;border-radius:12px;background:#222}.camera-bottom{height:104px;display:flex;align-items:center;justify-content:space-around;gap:10px}.shutter{width:68px;height:68px;border:5px solid white!important;border-radius:50%!important;padding:0!important;background:#fff!important;box-shadow:inset 0 0 0 3px #333}.camera-status{color:#ddd;font-size:12px;text-align:center;padding:6px}.move-photo{position:absolute;top:4px;left:4px;border:0;border-radius:7px;background:#222b;color:white;padding:4px 7px;font-size:12px}@media(min-width:620px){.notes{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>
<header><div><h1>Photo Note</h1><div class="sub">写真と一緒に、日々を残す。</div></div><div class="count" id="count">0 notes</div></header><main>
<section class="composer"><div class="pickrow"><button class="pick" id="openCamera" type="button">カメラで撮る</button><label class="pick" for="galleryPhotos">写真をまとめて選ぶ</label></div><input id="galleryPhotos" type="file" accept="image/*" multiple>
<div class="photo-grid" id="draftGrid"></div><div class="photo-count" id="photoCount">写真は最大100枚まで追加できます</div><textarea id="memo" maxlength="5000" placeholder="このノートについてメモを書く…"></textarea><div class="editor-tools"><span class="char-count" id="charCount">0 / 5,000文字</span><button class="cancel" id="cancel" type="button" style="display:none">編集をやめる</button></div><button class="save" id="save" disabled>ノートに保存する</button><div class="hint">写真とメモはこの端末のブラウザ内に保存されます。別の端末とは自動同期されません。写真100枚は容量が大きくなるため、端末の空き容量に注意してください。</div></section>
<div class="section"><h2>あなたのノート</h2><span>新しい順</span></div><section class="notes" id="notes"><div class="empty">まだノートはありません。<br>最初の写真を残してみましょう。</div></section></main>
<div class="camera-modal" id="cameraModal" role="dialog" aria-modal="true" aria-label="Photo Noteカメラ"><div class="camera-top"><button id="cameraClose" type="button">閉じる</button><span id="cameraMode">背面カメラ</span><button id="cameraSwitch" type="button">カメラ切替</button></div><div class="camera-stage"><video id="cameraVideo" autoplay muted playsinline></video></div><div class="camera-status" id="cameraStatus">カメラを準備しています</div><div class="camera-bottom"><button id="cameraFlash" type="button" disabled>フラッシュは端末依存</button><button class="shutter" id="cameraCapture" type="button" aria-label="撮影"></button><button id="cameraDone" type="button">完了</button></div></div><div class="photo-viewer" id="photoViewer" role="dialog" aria-modal="true" aria-label="写真の拡大表示"><button class="viewer-close" id="viewerClose" type="button">×</button><button class="viewer-prev" id="viewerPrev" type="button">‹</button><img id="viewerImage" alt="拡大した写真"><div class="zoom-tools"><button id="zoomOut" type="button" aria-label="縮小">−</button><button id="zoomReset" type="button" aria-label="倍率を戻す">↺</button><button id="zoomIn" type="button" aria-label="拡大">＋</button></div><button class="viewer-next" id="viewerNext" type="button">›</button><div class="viewer-index" id="viewerIndex"></div></div><div class="toast" id="toast"></div>
<script>
const DB='photo-note-db',STORE='notes';let db,draft=[],editingId=null,viewerImages=[],viewerAt=0,cameraStream=null,cameraFacing='environment';const $=id=>document.getElementById(id);
async function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}$('cameraVideo').srcObject=null}
async function startCamera(){await stopCamera();if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('cameraStatus').textContent='このブラウザではカメラを利用できません。HTTPSのSafariで開いてください。';return}try{cameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:cameraFacing},width:{ideal:1920},height:{ideal:1080}}});$('cameraVideo').srcObject=cameraStream;await $('cameraVideo').play();$('cameraMode').textContent=cameraFacing==='environment'?'背面カメラ':'前面カメラ';$('cameraStatus').textContent='撮影できます。撮影音の有無はiPhoneの仕様・設定に依存します。'}catch(err){$('cameraStatus').textContent=err.name==='NotAllowedError'?'カメラの使用が許可されていません。Safariの設定を確認してください。':'カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。';}}
$('openCamera').onclick=async()=>{if(draft.length>=100)return toast('写真は100枚までです');$('cameraModal').classList.add('open');document.body.style.overflow='hidden';await startCamera()};
$('cameraClose').onclick=async()=>{await stopCamera();$('cameraModal').classList.remove('open');document.body.style.overflow=''};
$('cameraDone').onclick=$('cameraClose').onclick;
$('cameraSwitch').onclick=async()=>{cameraFacing=cameraFacing==='environment'?'user':'environment';await startCamera()};
$('cameraCapture').onclick=async()=>{const v=$('cameraVideo');if(!cameraStream||!v.videoWidth)return toast('カメラの準備ができていません');if(draft.length>=100)return toast('写真は100枚までです');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0,c.width,c.height);draft.push(c.toDataURL('image/jpeg',.92));renderDraft();updateCount();$('cameraStatus').textContent=`撮影しました（${draft.length} / 100枚）。続けて撮影できます。`};
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function tx(mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,mode),s=t.objectStore(STORE);let req=fn(s);t.oncomplete=()=>resolve(req?.result);t.onerror=()=>reject(t.error)})}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function updateCount(){$('charCount').textContent=Array.from($('memo').value).length.toLocaleString('ja-JP')+' / 5,000文字';$('photoCount').textContent=`${draft.length} / 100枚`;$('save').disabled=draft.length===0}
function oldImages(n){return Array.isArray(n.images)?n.images:(n.image?[n.image]:[])}
function reset(){editingId=null;draft=[];$('galleryPhotos').value='';$('memo').value='';$('save').textContent='ノートに保存する';$('cancel').style.display='none';renderDraft();updateCount()}
$('memo').addEventListener('input',updateCount);$('cancel').onclick=reset;
function openViewer(images,index=0){viewerImages=images;viewerAt=index;showViewer();$('photoViewer').classList.add('open');document.body.style.overflow='hidden'}let zoom=1,panX=0,panY=0;function applyZoom(){$('viewerImage').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`}function resetZoom(){zoom=1;panX=0;panY=0;applyZoom()}function showViewer(){resetZoom();$('viewerImage').src=viewerImages[viewerAt];$('viewerIndex').textContent=`${viewerAt+1} / ${viewerImages.length}`;$('viewerPrev').style.display=viewerImages.length>1?'block':'none';$('viewerNext').style.display=viewerImages.length>1?'block':'none'}function closeViewer(){resetZoom();$('photoViewer').classList.remove('open');$('viewerImage').removeAttribute('src');document.body.style.overflow=''}$('viewerClose').onclick=closeViewer;$('photoViewer').addEventListener('click',e=>{if(e.target===$('photoViewer'))closeViewer()});$('viewerPrev').onclick=()=>{viewerAt=(viewerAt-1+viewerImages.length)%viewerImages.length;showViewer()};$('viewerNext').onclick=()=>{viewerAt=(viewerAt+1)%viewerImages.length;showViewer()};$('zoomIn').onclick=()=>{zoom=Math.min(4,zoom+.5);applyZoom()};$('zoomOut').onclick=()=>{zoom=Math.max(1,zoom-.5);if(zoom===1){panX=0;panY=0}applyZoom()};$('zoomReset').onclick=resetZoom;let pinchStart=0,pinchZoom=1,lastTouch=null;const viewerImg=$('viewerImage');viewerImg.addEventListener('touchstart',e=>{if(e.touches.length===2){pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchZoom=zoom}else if(e.touches.length===1&&zoom>1){lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY}}},{passive:false});viewerImg.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchStart){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom=Math.max(1,Math.min(4,pinchZoom*d/pinchStart));if(zoom===1){panX=0;panY=0}applyZoom()}else if(e.touches.length===1&&lastTouch&&zoom>1){e.preventDefault();panX+=e.touches[0].clientX-lastTouch.x;panY+=e.touches[0].clientY-lastTouch.y;lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};applyZoom()}},{passive:false});viewerImg.addEventListener('touchend',()=>{pinchStart=0;lastTouch=null});viewerImg.addEventListener('dblclick',()=>{zoom=zoom===1?2:1;if(zoom===1){panX=0;panY=0}applyZoom()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft'&&viewerImages.length){viewerAt=(viewerAt-1+viewerImages.length)%viewerImages.length;showViewer()}if(e.key==='ArrowRight'&&viewerImages.length){viewerAt=(viewerAt+1)%viewerImages.length;showViewer()}});
function fileData(f){return new Promise((res,rej)=>{if(!f.type.startsWith('image/'))return rej();const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function addFiles(files){const room=100-draft.length;if(room<=0)return toast('写真は100枚までです');const chosen=[...files].slice(0,room);if(files.length>room)toast('追加できるのは残り'+room+'枚です');for(const f of chosen){try{draft.push(await fileData(f))}catch{toast('画像を読み込めませんでした')}}renderDraft();updateCount()}
$('galleryPhotos').addEventListener('change',async e=>{await addFiles(e.target.files);e.target.value=''});
function renderDraft(){const root=$('draftGrid');root.innerHTML='';draft.forEach((src,i)=>{const cell=document.createElement('div');cell.className='photo-cell';const img=document.createElement('img');img.src=src;img.alt='追加した写真';img.onclick=()=>openViewer(draft,i);const rm=document.createElement('button');rm.className='remove-photo';rm.type='button';rm.textContent='×';rm.setAttribute('aria-label','写真を削除');rm.onclick=()=>{draft.splice(i,1);renderDraft();updateCount()};const move=document.createElement('button');move.className='move-photo';move.type='button';move.textContent=i===0?'先頭':`#${i+1} ↕`;move.title='写真を前へ移動';move.onclick=()=>{if(i>0){[draft[i-1],draft[i]]=[draft[i],draft[i-1]];renderDraft()}};cell.append(img,rm,move);root.append(cell)})}
$('save').onclick=async()=>{if(!draft.length)return toast('写真を追加してください');$('save').disabled=true;try{if(editingId){const n=await tx('readonly',s=>s.get(editingId));if(!n)throw Error();n.images=draft;n.image=draft[0];n.memo=$('memo').value;n.updatedAt=new Date().toISOString();await tx('readwrite',s=>s.put(n));toast('ノートを更新しました')}else{const n={id:Date.now(),images:draft,image:draft[0],memo:$('memo').value,date:new Date().toISOString()};await tx('readwrite',s=>s.add(n));toast('ノートに保存しました')}reset();await render()}catch(e){toast('保存できませんでした。端末の空き容量を確認してください');$('save').disabled=false}};
function beginEdit(n){editingId=n.id;draft=oldImages(n).slice();$('memo').value=n.memo||'';$('save').textContent='変更を保存する';$('cancel').style.display='inline-block';renderDraft();updateCount();document.querySelector('.composer').scrollIntoView({behavior:'smooth',block:'start'})}
async function render(){const all=await tx('readonly',s=>s.getAll());all.sort((a,b)=>b.id-a.id);$('count').textContent=all.length+' notes';const root=$('notes');root.innerHTML='';if(!all.length){root.innerHTML='<div class="empty">まだノートはありません。<br>最初の写真を残してみましょう。</div>';return}for(const n of all){const imgs=oldImages(n);const article=document.createElement('article');article.className='note';const cover=document.createElement('img');cover.className='cover';cover.src=imgs[0];cover.alt='ノートの写真';cover.onclick=()=>openViewer(imgs,0);const body=document.createElement('div');body.className='note-body';const date=document.createElement('div');date.className='date';date.textContent=new Date(n.updatedAt||n.date).toLocaleString('ja-JP',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+` ・ ${imgs.length}枚`;const text=document.createElement('div');text.className='note-text';text.textContent=n.memo||'メモはありません';const actions=document.createElement('div');actions.className='note-actions';const edit=document.createElement('button');edit.className='edit';edit.textContent='編集する';edit.onclick=()=>beginEdit(n);const del=document.createElement('button');del.className='delete';del.textContent='このノートを削除';del.onclick=async()=>{if(confirm('このノートを削除しますか？')){await tx('readwrite',s=>s.delete(n.id));if(editingId===n.id)reset();render()}};actions.append(edit,del);body.append(date,text);if(imgs.length>1){const strip=document.createElement('div');strip.className='thumb-strip';imgs.slice(1,7).forEach((src,i)=>{const im=document.createElement('img');im.src=src;im.alt='写真 '+(i+2);im.onclick=()=>openViewer(imgs,i+1);strip.append(im)});if(imgs.length>7){const more=document.createElement('span');more.style.cssText='font-size:11px;color:var(--muted);align-self:center';more.textContent=`+${imgs.length-7}`;strip.append(more)}body.append(strip)}body.append(actions);article.append(cover,body);root.append(article)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cameraStream)stopCamera()});
openDB().then(async d=>{db=d;updateCount();await render()}).catch(()=>toast('このブラウザでは保存機能を利用できません'));
</script></body></html>
